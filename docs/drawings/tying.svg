<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64756D"/></marker></defs><rect width="100%" height="100%" fill="#F4F1E9"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#233D35"><text x="50" y="58" font-size="30" font-weight="bold">Pabilo / tres vueltas por cada eje</text><text x="52" y="94" font-size="17" fill="#64756D">Hallacaitor v0.2.0 · mm · plano de referencia · CAD sin ensayo físico</text><rect x="170" y="260" width="760" height="320" rx="15" fill="#9AB4A3"/><rect x="254" y="260" width="560" height="320" rx="25" fill="#294F45"/><line x1="202" y1="520" x2="866" y2="520" stroke="#DEAD68" stroke-width="7" stroke-dasharray="12 7"/><text x="105" y="526" font-size="20" fill="#233D35">A1</text><line x1="202" y1="420" x2="866" y2="420" stroke="#DEAD68" stroke-width="7" stroke-dasharray="12 7"/><text x="105" y="426" font-size="20" fill="#233D35">A2</text><line x1="202" y1="320" x2="866" y2="320" stroke="#DEAD68" stroke-width="7" stroke-dasharray="12 7"/><text x="105" y="326" font-size="20" fill="#233D35">A3</text><line x1="406" y1="612" x2="406" y2="228" stroke="#C86744" stroke-width="6" stroke-dasharray="12 7"/><text x="393" y="210" font-size="20" fill="#233D35">B1</text><line x1="534" y1="612" x2="534" y2="228" stroke="#C86744" stroke-width="6" stroke-dasharray="12 7"/><text x="521" y="210" font-size="20" fill="#233D35">B2</text><line x1="662" y1="612" x2="662" y2="228" stroke="#C86744" stroke-width="6" stroke-dasharray="12 7"/><text x="649" y="210" font-size="20" fill="#233D35">B3</text><text x="170" y="175" font-size="19" fill="#233D35">Vista superior del paquete. Trazos discontinuos: pasos por debajo.</text><text x="170" y="650" font-size="20" fill="#233D35">A1 → A2 → A3: entrar por canal, volver por arriba en cada vuelta.</text><text x="170" y="692" font-size="20" fill="#233D35">B1 → B2 → B3: cambiar de eje y repetir con el mismo tramo.</text><text x="170" y="734" font-size="19" fill="#233D35">Conectar las vueltas por fuera del paquete; luego tensar y hacer nudo llano.</text><text x="170" y="780" font-size="17" fill="#64756D">Las líneas son rutas, no cuerdas preinstaladas. Hoja y cruces reales requieren ensayo.</text></g></svg>