name: Validate rectangular prototype
on:
  push:
    paths: ['cad/rectangular.scad', 'cad/hallacaitor.scad', 'cad/modular.scad', 'designs/v04/**', 'scripts/rect_v04.py', '.github/workflows/rect-v04.yml']
  pull_request:
    paths: ['cad/rectangular.scad', 'cad/hallacaitor.scad', 'cad/modular.scad', 'designs/v04/**', 'scripts/rect_v04.py', '.github/workflows/rect-v04.yml']
permissions:
  contents: read
jobs:
  rect-cad:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Export and check Rect geometry and sampled motion
        run: python scripts/rect_v04.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rect-cad-validation
          path: designs/v04/validation/*.json
