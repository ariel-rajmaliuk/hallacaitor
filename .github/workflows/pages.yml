name: Build and publish manual
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static manual and check every local link
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Detect Pages activation
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({...context.repo});
              core.setOutput('enabled','true');
            } catch (e) {
              if (![403,404].includes(e.status)) throw e;
              core.setOutput('enabled','false');
              core.notice('Manual built. Enable Settings > Pages > Source: GitHub Actions, then rerun this workflow. Public mirror: https://hallacaitor-manual.rajmaliuk.chatgpt.site');
            }
  deploy:
    if: needs.build.outputs.enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy manual
        id: deployment
        uses: actions/deploy-pages@v4
