name: Validate CAD
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Design constraints
        run: python -m unittest discover -s tests -v
      - name: Validate shipped STL files
        run: python scripts/validate.py --report build/shipped.json
      - name: Re-export from CAD
        run: python scripts/export.py --output build/rebuilt --jobs 2
      - name: Audit rebuilt meshes and compare geometry
        run: python scripts/validate.py --directory build/rebuilt --report build/rebuilt.json --compare docs/validation/geometry.json
      - name: Sample motion and needle routes
        run: python scripts/check_motion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-validation
          path: |
            build/*.json
            docs/validation/motion.json
